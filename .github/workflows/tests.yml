name: CI

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run Tests + Coverage
        # `shell: bash` switches this step from the default `bash -e {0}` to
        # `bash --noprofile --norc -eo pipefail {0}`. Without pipefail the pipeline
        # reports tee's exit status, so a red suite would leave this step green.
        shell: bash
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml | tee coverage.txt

      - name: Check Coverage Threshold
        shell: bash
        run: |
          # phpunit writes the summary with ANSI colour, and "Lines:" also appears in
          # the per-file rows, so strip the escapes and take only the first match.
          LINE_COVERAGE=$(sed 's/\x1b\[[0-9;]*m//g' coverage.txt | grep -m1 -E '^\s*Lines:' | awk '{print $2}' | tr -d '%')
          echo "Line coverage: ${LINE_COVERAGE}%"
          if [ -z "$LINE_COVERAGE" ]; then
            echo "Could not parse line coverage from coverage.txt"
            exit 1
          fi
          awk -v c="$LINE_COVERAGE" 'BEGIN { if (c + 0 < 80) { print "Coverage is below 80%!"; exit 1 } }'

  laravel-ai-floor:
    runs-on: ubuntu-latest

    name: laravel/ai floor (0.7.*)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: pcov

      - name: Pin laravel/ai to the bottom of its declared range
        run: |
          composer require "laravel/ai:0.7.*" --no-interaction --no-update
          composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Assert laravel/ai actually resolved to 0.7.x
        run: |
          RESOLVED_VERSION=$(composer show laravel/ai --format=json | jq -r '.versions[0]' | sed 's/^v//')
          echo "Resolved laravel/ai version: $RESOLVED_VERSION"
          if [[ "$RESOLVED_VERSION" != 0.7.* ]]; then
            echo "Expected laravel/ai to resolve to 0.7.*, got $RESOLVED_VERSION"
            exit 1
          fi

      - name: Run Tests
        run: vendor/bin/phpunit
